name: 测试与发布

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 运行单元测试
        run: node --test

      - name: 准备静态产物
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets extras _site/
          [ -f README.md ] && cp README.md _site/ || true
          # 单文件版一起发布，方便直接下载下来双击使用
          node build/standalone.mjs && cp youtiao-standalone.html _site/
          # 如果这个仓库同时用来存头像，把头像目录一起发布，
          # 这样「GitHub Pages」这条 CDN 线路也能用
          [ -d avatar ] && cp -r avatar _site/ || true
          touch _site/.nojekyll

      # 默认不发布任何东西 —— 是否要开一个公开站点、开在哪个域名下，
      # 由仓库主人自己决定。没开 Pages 时这里只是跳过，不会让 CI 变红。
      - name: 检查 Pages 是否已启用
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=已跳过部署::这个仓库还没有开启 Pages。想发布的话：Settings → Pages → Source 选「GitHub Actions」，然后重新运行本工作流。"
          fi

      - name: 配置 Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: 上传产物
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
