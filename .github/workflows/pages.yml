name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 运行单元测试（有失败就不发布）
        run: node --test

      - name: 准备静态产物
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets extras _site/
          [ -f README.md ] && cp README.md _site/ || true
          # 单文件版一起发布，方便直接下载下来双击使用
          node build/standalone.mjs && cp youtiao-standalone.html _site/
          # 如果这个仓库同时用来存头像，把头像目录一起发布，
          # 这样「GitHub Pages」这条 CDN 线路也能用
          [ -d avatar ] && cp -r avatar _site/ || true
          touch _site/.nojekyll

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
